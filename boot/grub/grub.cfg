# Enable serial console for headless VPS observability
serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console

set timeout=1
set default=0

# Ensure video drivers are available for UEFI GOP and BIOS VBE
insmod all_video


menuentry "LlamaOS/A (Self-Test Mode)" {
    multiboot2 /boot/llamaos.elf test
    boot
}

menuentry "LlamaOS/A" {
    multiboot2 /boot/llamaos.elf
    boot
}

menuentry "LlamaOS/A (Debug Mode)" {
    multiboot2 /boot/llamaos.elf debug
    boot
}

menuentry "LlamaOS/A (Isolated Test - Page Fault #PF)" {
    multiboot2 /boot/llamaos.elf test-pf
    boot
}

menuentry "LlamaOS/A (Isolated Test - Double Fault #DF)" {
    multiboot2 /boot/llamaos.elf test-df
    boot
}

menuentry "LlamaOS/A (Isolated Test - General Protection Fault #GP)" {
    multiboot2 /boot/llamaos.elf test-gp
    boot
}

