set timeout=0
set default=0

# Ensure video drivers are available for UEFI GOP and BIOS VBE
insmod all_video


menuentry "LlamaOS/A (Self-Test Mode)" {
    multiboot2 /boot/llamaos.elf test
    boot
}

menuentry "LlamaOS/A" {
    multiboot2 /boot/llamaos.elf
    boot
}

menuentry "LlamaOS/A (Debug Mode)" {
    multiboot2 /boot/llamaos.elf debug
    boot
}
